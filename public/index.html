<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.ing</title>
    <meta name="application-name" content="Last.ing">
    <meta name="description" content="A minimalist manual scrobbler for Last.fm">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://last-ing.vercel.app">
    <meta property="og:title" content="Last.ing">
    <meta property="og:description" content="A minimalist manual scrobbler for Last.fm">
    <meta property="og:image" content="https://i.imgur.com/XXR86GF.png">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Last.ing">
    <meta name="twitter:description" content="A minimalist manual scrobbler for Last.fm">
    <meta name="twitter:image" content="https://i.imgur.com/XXR86GF.png">

    <link rel="stylesheet" href="style.css" integrity="sha512-9/GH1RHykv+lHmeiYXm1DqR2hRAoY9skzTSkQ5jTN4KQ8tkRrAxVvB5IBv/zf5Fs/1MfzBC26ZTP0gp/nEfX6Q==">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b90000">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <link rel="canonical" href="https://last-ing.vercel.app">
</head>
<body>
    <div class="header-container">
        <div class="header-inner">
            <header class="header-content">
                <div class="logo-group">
                    <div class="logo-icon">
                        <img src="assets/icon.svg" alt="" class="logo-img">
                    </div>
                    <div class="app-branding">
                        <h1 class="app-title">Last.ing</h1>
                        <p class="app-subtitle">For Last.fm</p>
                    </div>
                </div>

                <div id="header-user-info" class="header-right hidden">
                    <img id="user-avatar" class="user-avatar hidden" alt="User Avatar">
                    <a id="username-display" href="#" target="_blank">...</a>
                    <button id="logout-btn" class="btn text-btn" aria-label="Logout">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </header>
        </div>
    </div>

    <div class="container">
        <main>
            <div id="status-message" class="hidden"></div>

            <section id="auth-section" class="hidden">
                <p>Connect your Last.fm account to start scrobbling manually.</p>
                <button id="login-btn" class="btn primary">Login with Last.fm</button>
            </section>

            <section id="scrobble-section" class="hidden">
                <div class="mode-toggle">
                    <button id="mode-track" class="toggle-btn active">Track</button>
                    <button id="mode-album" class="toggle-btn">Album</button>
                    <button id="mode-fix-past" class="toggle-btn">Fix Past</button>
                </div>

                <form id="scrobble-form">
                    <div class="form-group">
                        <label for="artist">Artist</label>
                        <div class="input-wrapper">
                            <input type="text" id="artist" name="artist" required placeholder="e.g. Pink Floyd">
                            <button type="button" id="pin-artist" class="pin-btn" aria-label="Pin Artist">
                                <svg viewBox="0 0 24 24"><path d="M16 12V4H17V2H7V4H8V12L6 14V16H11V22H13V16H18V14L16 12Z" /></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="track">Track</label>
                        <div class="input-wrapper">
                            <input type="text" id="track" name="track" required placeholder="e.g. Time">
                            <button type="button" id="pin-track" class="pin-btn" aria-label="Pin Track">
                                <svg viewBox="0 0 24 24"><path d="M16 12V4H17V2H7V4H8V12L6 14V16H11V22H13V16H18V14L16 12Z" /></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="album">Album (Optional)</label>
                        <div class="flex-group">
                            <div class="input-wrapper flex-1">
                                <input type="text" id="album" name="album" placeholder="e.g. The Dark Side of the Moon">
                                <button type="button" id="pin-album" class="pin-btn" aria-label="Pin Album">
                                    <svg viewBox="0 0 24 24"><path d="M16 12V4H17V2H7V4H8V12L6 14V16H11V22H13V16H18V14L16 12Z" /></svg>
                                </button>
                            </div>
                            <button type="button" id="find-album-btn" class="btn secondary small-btn" title="Find Suitable Albums">Find</button>
                        </div>
                        <div id="track-album-results" class="results-grid hidden"></div>
                    </div>

                    <div class="form-group">
                        <label for="album-artist">Album Artist (Optional)</label>
                        <div class="flex-group">
                            <div class="input-wrapper flex-1">
                                <input type="text" id="album-artist" name="album-artist" placeholder="e.g. Pink Floyd">
                                <button type="button" id="pin-album-artist" class="pin-btn" aria-label="Pin Album Artist">
                                    <svg viewBox="0 0 24 24"><path d="M16 12V4H17V2H7V4H8V12L6 14V16H11V22H13V16H18V14L16 12Z" /></svg>
                                </button>
                            </div>
                            <button type="button" id="va-btn" class="btn secondary small-btn" title="Set to Various Artists">VA</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="date">Timestamp</label>
                        <div class="datetime-group">
                             <input type="date" id="date" name="date" required>
                             <input type="time" id="time" name="time" required step="1" aria-label="Time">
                             <button type="button" id="track-now-btn" class="btn secondary small-btn">Now</button>
                        </div>
                    </div>

                    <button type="submit" id="scrobble-btn" class="btn primary">Scrobble Track</button>
                </form>

                <div id="album-scrobble-container" class="hidden">
                    <div id="album-search-view">
                        <div class="form-group">
                            <label for="album-search-input">Artist or Album</label>
                            <div class="search-box">
                                <input type="text" id="album-search-input" placeholder="e.g. The Wall">
                                <button id="album-search-btn" class="btn secondary">Search</button>
                            </div>
                        </div>
                        <div id="album-results" class="results-grid"></div>
                    </div>

                    <div id="album-verification-view" class="hidden">
                        <button id="back-to-search" class="btn text-btn">&larr; Back to Search</button>
                        <div class="selected-album-header">
                            <div class="header-actions">
                                <button id="edit-album-btn" class="btn text-btn edit-btn" title="Edit Album Details">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </button>
                            </div>
                            <div class="selected-album-info">
                                <div class="album-details-view" id="album-view-mode">
                                    <a id="album-link-display" href="#" target="_blank" class="album-title-link">Album Name</a>
                                    <a id="artist-link-display" href="#" target="_blank" class="album-artist-link">Artist Name</a>
                                </div>
                                <div class="album-details-edit hidden" id="album-edit-mode">
                                     <input type="text" id="selected-album-name" class="edit-input album-name-input" placeholder="Album Name">
                                     <input type="text" id="selected-album-artist" class="edit-input album-artist-input" placeholder="Artist Name">
                                </div>
                            </div>
                            <img id="selected-album-cover" class="selected-album-cover" src="" alt="Album Cover">
                        </div>

                        <div class="form-group">
                            <label for="album-date">Last Track Timestamp</label>
                            <div class="datetime-group">
                                 <input type="date" id="album-date" required>
                                 <input type="time" id="album-time" required step="1" aria-label="Time">
                                 <button type="button" id="album-now-btn" class="btn secondary small-btn">Now</button>
                            </div>
                        </div>

                        <div id="tracklist-container">
                        </div>

                        <div id="album-tracks-not-found" class="hidden">
                            <p class="no-tracks-message">Tracklist not found.</p>
                            <button id="continue-manual-btn" class="btn primary">Continue Manually</button>
                        </div>

                        <button id="confirm-album-scrobble-btn" class="btn primary">Scrobble Album</button>
                    </div>
                </div>

                <div id="fix-past-section" class="hidden">
                    <div id="fix-past-controls">
                        <div class="filters">
                            <button id="filter-no-album" class="btn secondary small-btn">No Album</button>
                            <button id="filter-duplicates" class="btn secondary small-btn">Duplicates</button>
                            <button id="reload-history-btn" class="btn secondary small-btn" title="Reload History">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                                Refresh
                            </button>
                        </div>
                    </div>
                    <div id="history-list">
                    </div>
                    <button id="load-more-history-btn" class="btn secondary hidden">Load More</button>
                </div>
            </section>
        </main>

    </div>

    <footer>
        <p>If it doesn’t scrobble, it doesn’t count.</p>
        <p>Built by <a href="https://github.com/comet-builds/Last.ing" target="_blank">comet</a>.</p>
    </footer>

    <div id="loading-spinner-container" class="spinner-container hidden">
        <div class="spinner"></div>
    </div>

    <script type="module" src="app.js" integrity="sha512-b5L8sAyMtk3CbXTsnJLWNZSnxr0j9O2AKS4CCsNmcHXwUOWJzVRQV3IiScAVM/JZqnz/6hiYrQsuwEBss8KZ+Q=="></script>
</body>
</html>
